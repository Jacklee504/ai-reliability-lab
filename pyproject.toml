[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reliability-lab"
version = "0.1.0"
description = "Tools for checking what an AI system received, fulfilled the request, grounded its claims, and acted within the user's authority."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
airl = "ai_reliability.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
